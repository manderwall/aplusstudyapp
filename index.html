<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Cross-platform PWA install (Android Chrome / Edge / desktop). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="A+ Study">
  <meta name="author" content="Amanda Kondrat'yev">
  <meta name="description" content="CompTIA A+ exam study app — spaced repetition, practice quizzes, and concept review. An unofficial, independent project by Amanda Kondrat'yev.">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <!-- iOS PWA install -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A+ Study">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- Preload the critical-path data + script so they fetch in parallel
       with the rest of <head>, instead of serially after app.js parses.
       Saves ~150ms RTT on cold mobile loads. concept-fixes.json is NOT
       preloaded — it's deferred until the user opens Reading. -->
  <link rel="preload" href="app.js" as="script" crossorigin>
  <link rel="preload" href="lib.mjs" as="script" crossorigin>
  <link rel="preload" href="data/core2/questions.json" as="fetch" crossorigin>
  <title>A+ Study</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app">
    <header>
      <h1 id="mode-title">Loading…</h1>
      <div class="header-right">
        <div id="progress-hud" role="status" aria-live="polite" aria-atomic="true"></div>
        <button id="help-btn" type="button" aria-label="Help / welcome" title="Help & options">❓</button>
        <button id="sync-btn" type="button" aria-label="Sync &amp; backup" title="Sync &amp; backup (save across devices)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 16.5a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17.5 8a3.5 3.5 0 0 1 .5 6.95"/><path d="M9.7 13.2 12 10.9l2.3 2.3"/><path d="M12 10.9v6.4"/></svg></button>
        <button id="listen-btn" type="button" aria-label="Read the current card aloud" aria-pressed="false" title="Listen — read the card aloud" hidden>🔈</button>
        <button id="focus-btn" type="button" aria-label="Enter focus mode" aria-pressed="false" title="Focus mode — hide distractions (press F)">🎯</button>
        <button id="theme-btn" type="button" aria-label="Toggle theme" title="Theme (auto/light/dark) — press T">🌓</button>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <nav id="tabbar" aria-label="Main sections">
      <!-- Not role=tablist: that ARIA pattern expects arrow-key navigation,
           roving tabindex, and tabpanel association. We have none of those
           and the half-state confuses screen readers. Plain buttons with
           aria-current="page" announce correctly ("study, current page"). -->
      <button data-mode="study" class="tab active" aria-current="page">
        <span class="tab-icon" aria-hidden="true">📚</span>
        <span class="tab-label">Study</span>
        <span class="tab-badge" id="study-due-badge" hidden aria-hidden="true"></span>
      </button>
      <button data-mode="quiz" class="tab">
        <span class="tab-icon" aria-hidden="true">❓</span>
        <span class="tab-label">Quiz</span>
      </button>
      <button data-mode="reading" class="tab">
        <span class="tab-icon" aria-hidden="true">📖</span>
        <span class="tab-label">Reading</span>
      </button>
      <button data-mode="stats" class="tab">
        <span class="tab-icon" aria-hidden="true">📊</span>
        <span class="tab-label">Stats</span>
      </button>
    </nav>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
