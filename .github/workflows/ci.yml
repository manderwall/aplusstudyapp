name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Syntax-check JS sources
        run: |
          node --check app.js
          node --check lib.mjs
          node --check crypto.mjs
          node --check sw.js
      - name: Validate questions.json
        run: node scripts/validate-questions.mjs data/core2/questions.json
      - name: Validate concept-fixes (no executable HTML)
        run: node scripts/validate-concept-fixes.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs

  # Browser smoke suite (tests/smoke/). The earlier attempt failed at
  # puppeteer's bundled-Chromium launch on the runner (missing system
  # libs like libnss3/libgbm). Fix: install a runner Chrome *with its
  # system deps* via setup-chrome, skip puppeteer's own browser
  # download, and point puppeteer at that binary. The harness already
  # launches with --no-sandbox --disable-dev-shm-usage (tests/smoke/
  # _harness.mjs), and puppeteer honours PUPPETEER_EXECUTABLE_PATH.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chrome + system deps
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install devDependencies (skip puppeteer's browser fetch)
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Browser smoke (regression — gates the PR)
        run: npm run smoke
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
