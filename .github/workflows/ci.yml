name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax-check JS sources
        run: |
          node --check app.js
          node --check lib.mjs
          node --check crypto.mjs
          node --check sw.js
      - name: Validate questions.json
        run: node scripts/validate-questions.mjs data/core2/questions.json
      - name: Validate concept-fixes (no executable HTML)
        run: node scripts/validate-concept-fixes.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs

  # Browser smoke suite runs in a SEPARATE job so the fast `check` gate
  # above (syntax + validators + unit tests, ~10s) keeps giving instant
  # feedback. continue-on-error makes this job advisory: a flaky Chromium
  # download or runner-env quirk shows up as a warning but NEVER blocks a
  # merge. The local `npm run smoke` (10/10, verified) is the source of
  # truth; this is the automated bonus.
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dev dependencies (puppeteer)
        run: npm install --no-audit --no-fund
      # Puppeteer v23+ no longer guarantees the browser is fetched by the
      # install postinstall in every CI env. Install it explicitly so the
      # launch doesn't fail with "Could not find Chrome".
      - name: Ensure Chromium is installed
        run: npx puppeteer browsers install chrome
      - name: Browser regression smoke
        run: npm run smoke
